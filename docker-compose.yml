version: '3.8'

services:
  crispr-offtarget-scanner:
    build: .
    container_name: crispr-offtarget-scanner
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Set a strong random secret in production
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-change-me-in-production}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
